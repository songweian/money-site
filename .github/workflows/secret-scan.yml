name: 密钥泄漏扫描

# 每次推送与 PR 都扫描全量历史，防止凭据被误提交
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks 全历史扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config-check:
    name: 敏感文件与硬编码检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认敏感路径未被跟踪
        run: |
          set -euo pipefail
          echo "检查是否有被跟踪的敏感文件..."
          if git ls-files | grep -Ei '(\.env$|\.env\.|credentials|secret|\.pem$|\.key$|service[-_]?account|id_rsa|workbuddy)'; then
            echo "::error::检测到敏感文件被 Git 跟踪，请移除后再推送"
            exit 1
          fi
          echo "未发现被跟踪的敏感文件"

      - name: 确认工作流未硬编码凭据
        run: |
          set -euo pipefail
          echo "检查工作流中是否硬编码密钥..."
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' .github/ ; then
            echo "::error::工作流中发现疑似硬编码密钥"
            exit 1
          fi
          echo "未发现硬编码密钥"
