name: 密钥泄漏扫描

# 每次推送与 PR 都扫描全量历史，防止凭据被误提交
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks 全历史扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 执行扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config-check:
    name: 敏感文件与硬编码检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认敏感路径未被跟踪
        run: |
          set -uo pipefail
          echo "检查是否有被跟踪的敏感文件..."
          # 匹配 .env / .env.local 等真实环境变量文件，但放行 .env.example 模板
          # 匹配私钥、凭证、SSH 私钥，以及本地工具目录 .workbuddy/
          hits=$(git ls-files \
            | grep -Ei '(\.env$|\.env\.[a-z]+$|credentials|\.pem$|\.key$|service[-_]?account|id_rsa|^\.workbuddy/)' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到敏感文件被 Git 跟踪：$hits"
            exit 1
          fi
          echo "未发现被跟踪的敏感文件"

      - name: 确认源码未硬编码凭据
        run: |
          set -uo pipefail
          echo "检查是否硬编码密钥..."
          # 排除本工作流自身（内含检测正则）
          hits=$(grep -rInE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' \
            --exclude=secret-scan.yml \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git . || true)
          if [ -n "$hits" ]; then
            echo "::error::发现疑似硬编码密钥：$hits"
            exit 1
          fi
          echo "未发现硬编码密钥"
